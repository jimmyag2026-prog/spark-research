[project]
name = "spark-research"
version = "0.8.0a2"
description = "Spark Research 科研工作台的 Python kernel、仿真与实验室模块"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
addopts = "--import-mode=importlib"
# 本仓约定的测试文件名是 `<模块>.test.py`，不匹配 pytest 默认的 `test_*.py` / `*_test.py`。
# P5 之前 `pytest tests/` 会**静默收集到 0 个用例**（只有显式指定文件名才跑得到），
# 等于整个 Python 侧没有测试门槛。这里把模式补上。
python_files = ["*.test.py", "test_*.py", "*_test.py"]

[tool.uv]
package = true

# P5 起本机 .venv 用 uv 建（`uv venv --python 3.12 .venv`），依赖用
# `VIRTUAL_ENV=.venv uv pip install <pkg>` 装进 .venv —— **不动系统 python**。
# 实测：OpenMM 8.6 在 PyPI 上有 macOS arm64 wheel，无需 conda。
[dependencies]
numpy = ">=1.26"
pandas = ">=2.0"
jupyter-client = ">=8.0"
ipykernel = ">=6.29"
rdkit = ">=2023.9"
# P5 干实验：OpenMM adapter（backend/src/simulation/openmm/）。
# pyref adapter 刻意零依赖（纯标准库），所以 CI 里没装 openmm 也能跑契约测试。
openmm = ">=8.1"
# P6 湿实验：Opentrons 官方模拟器（backend/src/lab/opentrons_backend.py）。
# 纯 Python 包，`opentrons.simulate` API 与 `opentrons_simulate` CLI 一并装上。
# ⚠️ 它会把 numpy 钉到 1.26.x（opentrons-shared-data 的约束）——实测 openmm 8.6 在
#    numpy 1.26.4 下照常工作，P5 的契约测试全绿。装的顺序无所谓，结果一样。
opentrons = ">=9.0"
# v0.5 W5-3 干实验 · C3 组学三件套（backend/src/simulation/{scanpy,pydeseq2,cobrapy}/）。
# 实测（2026-09-10，macOS arm64 / Python 3.12 / uv 0.10.2）：
#   `uv pip install "numpy<2" scanpy pydeseq2 cobra` → 74 个包、**43 秒**，全部有 wheel，
#   零源码编译。追加 `leidenalg igraph` 再 0.9 秒。
# ⚠️ numpy 必须钉在 <2：opentrons-shared-data 把 numpy 锁在 1.26.x，而 scanpy 系默认会
#    往 2.x 拉。实测 "numpy<2" 约束下三件套与 openmm 8.6 全部正常，P5 契约测试不受影响。
# leidenalg + igraph 不是 scanpy 的硬依赖，但 runner 的 leiden 聚类一定用得上——
# 所以它们缺失时探测就报不可用（见 simulation/scanpy/runner.py 的 probe()）。
scanpy = ">=1.11"
leidenalg = ">=0.10"
igraph = ">=0.11"
pydeseq2 = ">=0.5"
cobra = ">=0.29"
pytest = ">=8.0"
